# Home-Display, built from this folder instead of pulled from a registry.
#
# Use this until an image has been published (or to run a version you changed yourself):
#
#   docker compose -f docker-compose.build.yml up -d --build
#
# It is the same as docker-compose.yml except for `build: .` in place of `image:`.
# Setup (the .env and config/config.yaml files) is exactly the same; see README.md.

services:
  home-display:
    build: .
    image: home-display:local
    restart: unless-stopped
    ports:
      # Home network only. Do NOT port-forward this on your router.
      # If 8080 is already used on this machine, change the left number (for example 8081).
      - "8080:8080"
    env_file: .env
    volumes:
      - ./config/config.yaml:/config/config.yaml:ro
      # All mutable state: Google tokens, dashboard settings, photos, icons. Back this up.
      - home-display-data:/data

volumes:
  home-display-data:
