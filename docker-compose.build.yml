# Home-Display, built from this folder instead of pulled from a registry.
#
# Use this until an image has been published (or to run a version you changed yourself):
#
#   docker compose -f docker-compose.build.yml up -d --build
#
# It is the same as docker-compose.yml except for `build: .` in place of `image:`.
# Setup (the .env and config/config.yaml files) is exactly the same; see README.md.

services:
  home-display:
    build: .
    image: home-display:local
    restart: unless-stopped
    ports:
      # Home network only. Do NOT port-forward this on your router.
      # If 8080 is already used on this machine, set HOST_PORT=8081 in .env (any free port).
      - "${HOST_PORT:-8080}:8080"
    env_file: .env
    volumes:
      - ./config/config.yaml:/config/config.yaml:ro
      # All mutable state: Google tokens, dashboard settings, photos, icons. Back this up.
      - home-display-data:/data

  # Optional: reach the displays from outside through a Cloudflare Tunnel (see README).
  # Needs CLOUDFLARE_TUNNEL_TOKEN in .env. Start it with:
  #   docker compose -f docker-compose.build.yml --profile tunnel up -d
  # In Cloudflare, point the tunnel's public hostname at  http://home-display:8080
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - home-display

volumes:
  home-display-data:
