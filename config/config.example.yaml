# Copy to config/config.yaml (it is gitignored). Unknown keys are errors.
#
# This file only needs to describe your starting point: one display and one calendar.
# Everything else (more displays, which calendars show, photos, links, text size...) is
# done in the dashboard at /admin and saved to data/settings.json.

# The display opened at /display (and at /).
defaultScreen: kitchen

calendars:
  # A Google calendar. "account" is a short name you choose; you connect that name to a
  # real Google account once, in the dashboard (Accounts tab). No passwords are stored.
  james-personal:
    account: james
    calendarId: primary       # "primary" is the account's own calendar
    label: James
    color: "#4f9dff"

# Each screen is a "display" served at /display/<id>. The names admin, display, api,
# photos, icons and assets are reserved.
screens:
  kitchen:
    title: Kitchen
    timezone: America/Edmonton   # an IANA name, e.g. America/Toronto, Europe/London
    calendars: [james-personal]
    layout: month-grid           # month-grid | portrait-week | landscape-split | portrait-agenda
    mode: kiosk                  # kiosk (wall screen) | interactive (browser homepage)
